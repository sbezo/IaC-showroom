services:
  postgres:
    image: postgres:15
    container_name: netbox-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
    volumes:
      - netbox_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: netbox-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netbox_redis_data:/data

  netbox:
    image: netboxcommunity/netbox:latest
    container_name: netbox
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    environment:
      - ALLOWED_HOSTS=*
      - DB_HOST=postgres
      - DB_NAME=netbox
      - DB_USER=netbox
      - REDIS_HOST=redis
      - DB_WAIT_DEBUG=1

    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - netbox_media:/opt/netbox/media
      - netbox_reports:/opt/netbox/reports
      - netbox_scripts:/opt/netbox/scripts

volumes:
  netbox_postgres_data:
  netbox_redis_data:
  netbox_media:
  netbox_reports:
  netbox_scripts:
