map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name n8n.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name n8n.example.test;

    ssl_certificate /etc/nginx/ssl/n8n.example.test.crt;
    ssl_certificate_key /etc/nginx/ssl/n8n.example.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $n8n_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
