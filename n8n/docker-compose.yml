services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Fill POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Fill POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
      N8N_DB_USER: ${N8N_DB_USER:?Fill N8N_DB_USER in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Fill N8N_DB_PASSWORD in .env}

      AUTOMATION_DB: ${AUTOMATION_DB:?Fill AUTOMATION_DB in .env}
      AUTOMATION_DB_USER: ${AUTOMATION_DB_USER:?Fill AUTOMATION_DB_USER in .env}
      AUTOMATION_DB_PASSWORD: ${AUTOMATION_DB_PASSWORD:?Fill AUTOMATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./provision-automation.sh:/docker-entrypoint-initdb.d/provision-automation.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Preserve the dollar signs in the generated bcrypt hash.
    env_file:
      - path: .owner.env
        format: raw
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Fill N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: n8n.example.test
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.example.test/
      N8N_WEBHOOK_URL: https://n8n.example.test/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Europe/Bratislava
      TZ: Europe/Bratislava
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Fill N8N_RUNNERS_AUTH_TOKEN in .env}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz/readiness', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  runners:
    image: n8nio/runners:2.42.7
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}

volumes:
  postgres_data:
  n8n_data:
