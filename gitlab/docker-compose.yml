services:
  gitlab:
    image: gitlab/gitlab-ee:18.4.2-ee.0
    container_name: gitlab
    restart: always
    hostname: 'gitlab.example.test'
    ports:
      - '80:80'
      - '443:443'
      - '2222:22'
    volumes:
      - '$GITLAB_HOME/config:/etc/gitlab'
      - '$GITLAB_HOME/logs:/var/log/gitlab'
      - '$GITLAB_HOME/data:/var/opt/gitlab'
    shm_size: '256m'
