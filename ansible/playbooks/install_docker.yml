---
- hosts: docker_hosts
  gather_facts: false
  become: yes
  pre_tasks:
    - name: Stop public reference playbooks
      ansible.builtin.fail:
        msg: "Reference only. Adapt this playbook and remove this guard in your own lab."

  tasks:
    - name: Install required system packages for docker
      apt:
        pkg:
          - ca-certificates
          - curl
          - apt-transport-https
          - gpg
          - make
          - golang
          - git
        state: latest
        update_cache: true

    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Update apt and install docker
      apt:
        pkg:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        state: latest
        update_cache: true

    - name: adding ubuntu user to 'docker' group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Enable docker.service
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true

    - name: Enable containerd.service
      ansible.builtin.systemd_service:
        name: containerd.service
        enabled: true
