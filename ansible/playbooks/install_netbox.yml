- hosts: app-host
  gather_facts: false
  become: yes
  pre_tasks:
    - name: Stop public reference playbooks
      ansible.builtin.fail:
        msg: "Reference only. Adapt this playbook and remove this guard in your own lab."

  tasks:
    - name: Create netbox directory
      ansible.builtin.file:
        path: /opt/netbox
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy docker-compose.yml
      copy:
        src: "{{ root_dir }}/netbox/docker-compose.yml"
        dest: /opt/netbox/docker-compose.yml
        owner: root
        group: root
        mode: '0644'

    - name: Copy netbox .env file
      ansible.builtin.copy:
        src: "{{ root_dir }}/netbox/.env"
        dest: /opt/netbox/.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false

    - name: Deploy systemd service for netbox
      ansible.builtin.template:
        src: "{{ root_dir }}/netbox/netbox.service"
        dest: /etc/systemd/system/netbox.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd to pick up new unit
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Enable and start netbox service
      ansible.builtin.systemd:
        name: netbox
        enabled: yes
        state: started
