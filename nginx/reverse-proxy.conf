server {
    listen 443 ssl;
    server_name netbox.example.test;

    ssl_certificate     /etc/nginx/ssl/netbox.example.test.crt;
    ssl_certificate_key /etc/nginx/ssl/netbox.example.test.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name phpipam.example.test;

    ssl_certificate     /etc/nginx/ssl/phpipam.example.test.crt;
    ssl_certificate_key /etc/nginx/ssl/phpipam.example.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /  {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Nginx-Proxy true;
            proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    server_name demo-app.example.test;

    ssl_certificate     /etc/nginx/ssl/demo-app.example.test.crt;
    ssl_certificate_key /etc/nginx/ssl/demo-app.example.test.key;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name netbox.example.test www.netbox.example.test phpipam.example.test www.phpipam.example.test;

    return 301 https://$host$request_uri;
}
